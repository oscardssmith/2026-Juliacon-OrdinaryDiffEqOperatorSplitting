<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg
   width="224mm"
   height="124mm"
   viewBox="14 20 224 124"
   version="1.1"
   id="svg-complex-time-step"
   xmlns="http://www.w3.org/2000/svg"
   xmlns:svg="http://www.w3.org/2000/svg">
  <defs id="defs-complex-time-step">
    <marker
       style="overflow:visible"
       id="arrow-step"
       refX="4.5"
       refY="0"
       orient="auto-start-reverse"
       markerWidth="1"
       markerHeight="1"
       viewBox="0 0 1 1"
       preserveAspectRatio="xMidYMid">
      <path
         transform="scale(0.5)"
         d="M -2,-4 9,0 -2,4 c 2,-2.33 2,-5.66 0,-8 z"
         style="fill:context-stroke;fill-rule:evenodd;stroke:none"
         id="path-arrow-step" />
    </marker>
    <marker
       style="overflow:visible"
       id="arrow-axis"
       refX="8.1"
       refY="0"
       orient="auto-start-reverse"
       markerWidth="1"
       markerHeight="1"
       viewBox="0 0 1 1"
       preserveAspectRatio="xMidYMid">
      <path
         transform="scale(0.9)"
         d="M -2,-4 9,0 -2,4 c 2,-2.33 2,-5.66 0,-8 z"
         style="fill:context-stroke;fill-rule:evenodd;stroke:none"
         id="path-arrow-axis" />
    </marker>
  </defs>

  <g id="layer-axes"
     style="font-family:Lato, sans-serif">

    <!-- real axis -->
    <path
       d="M 22,88 H 230"
       style="fill:none;stroke:#eeeeee;stroke-width:0.5;marker-end:url(#arrow-axis)"
       id="axis-re" />
    <text x="228" y="83" text-anchor="end"
       style="font-size:6px;fill:#eeeeee">Re(t)</text>

    <!-- imaginary axis -->
    <path
       d="M 40,132 V 26"
       style="fill:none;stroke:#eeeeee;stroke-width:0.5;marker-end:url(#arrow-axis)"
       id="axis-im" />
    <text x="44" y="28"
       style="font-size:6px;fill:#eeeeee">Im(t)</text>

    <!-- guides from the intermediate nodes down to the real axis -->
    <path d="M 100,58 V 88"
       style="fill:none;stroke:#999999;stroke-width:0.35;stroke-dasharray:2,2" />
    <path d="M 140,118 V 88"
       style="fill:none;stroke:#999999;stroke-width:0.35;stroke-dasharray:2,2" />

    <!-- the three complex substeps -->
    <path d="M 40,88 100,58"
       style="fill:none;stroke:#9b5cff;stroke-width:1.2;marker-end:url(#arrow-step)"
       id="substep-1" />
    <path d="M 100,58 140,118"
       style="fill:none;stroke:#ffaf00;stroke-width:1.2;marker-end:url(#arrow-step)"
       id="substep-2" />
    <path d="M 140,118 200,88"
       style="fill:none;stroke:#ff5a5a;stroke-width:1.2;marker-end:url(#arrow-step)"
       id="substep-3" />

    <text x="66" y="66" text-anchor="middle"
       style="font-size:6px;fill:#9b5cff">step 1</text>
    <text x="130" y="78"
       style="font-size:6px;fill:#ffaf00">step 2</text>
    <text x="172" y="112" text-anchor="middle"
       style="font-size:6px;fill:#ff5a5a">step 3</text>

    <!-- nodes -->
    <circle cx="40"  cy="88"  r="1.8" style="fill:#eeeeee" />
    <circle cx="100" cy="58"  r="1.6" style="fill:#eeeeee" />
    <circle cx="140" cy="118" r="1.6" style="fill:#eeeeee" />
    <circle cx="200" cy="88"  r="1.8" style="fill:#eeeeee" />

    <text x="37" y="96" text-anchor="end"
       style="font-size:6px;fill:#eeeeee">t<tspan dy="1.5" style="font-size:4px">n</tspan></text>
    <text x="203" y="96"
       style="font-size:6px;fill:#eeeeee">t<tspan dy="1.5" style="font-size:4px">n + dt</tspan></text>

    <text x="126" y="140" text-anchor="middle"
       style="font-size:5.5px;fill:#999999">the substeps sum to a real dt, but each stage integrates in complex time</text>
  </g>
</svg>
