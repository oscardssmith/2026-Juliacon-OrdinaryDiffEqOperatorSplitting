<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg
   width="220mm"
   height="96mm"
   viewBox="16 32 220 96"
   version="1.1"
   id="svg-strang-splitting"
   xmlns="http://www.w3.org/2000/svg"
   xmlns:svg="http://www.w3.org/2000/svg">
  <defs id="defs-strang-splitting">
    <marker
       style="overflow:visible"
       id="arrow-lane"
       refX="4.5"
       refY="0"
       orient="auto-start-reverse"
       markerWidth="1"
       markerHeight="1"
       viewBox="0 0 1 1"
       preserveAspectRatio="xMidYMid">
      <path
         transform="scale(0.5)"
         d="M -2,-4 9,0 -2,4 c 2,-2.33 2,-5.66 0,-8 z"
         style="fill:context-stroke;fill-rule:evenodd;stroke:none"
         id="path-arrow-lane" />
    </marker>
    <marker
       style="overflow:visible"
       id="arrow-time"
       refX="8.1"
       refY="0"
       orient="auto-start-reverse"
       markerWidth="1"
       markerHeight="1"
       viewBox="0 0 1 1"
       preserveAspectRatio="xMidYMid">
      <path
         transform="scale(0.9)"
         d="M -2,-4 9,0 -2,4 c 2,-2.33 2,-5.66 0,-8 z"
         style="fill:context-stroke;fill-rule:evenodd;stroke:none"
         id="path-arrow-time" />
    </marker>
  </defs>

  <g id="layer-strang"
     style="font-family:Lato, sans-serif">

    <!-- guides tying the lane ends to the ticks -->
    <path d="M 50,38 V 110"
       style="fill:none;stroke:#999999;stroke-width:0.35;stroke-dasharray:2,2" />
    <path d="M 130,38 V 110"
       style="fill:none;stroke:#999999;stroke-width:0.35;stroke-dasharray:2,2" />
    <path d="M 210,38 V 110"
       style="fill:none;stroke:#999999;stroke-width:0.35;stroke-dasharray:2,2" />

    <!-- the three substeps, top to bottom in the order they are applied -->
    <path d="M 50,48 H 130"
       style="fill:none;stroke:#9b5cff;stroke-width:1.2;marker-end:url(#arrow-lane)"
       id="lane-f-first" />
    <path d="M 50,68 H 210"
       style="fill:none;stroke:#ffaf00;stroke-width:1.2;marker-end:url(#arrow-lane)"
       id="lane-g" />
    <path d="M 130,88 H 210"
       style="fill:none;stroke:#ff5a5a;stroke-width:1.2;marker-end:url(#arrow-lane)"
       id="lane-f-second" />

    <circle cx="50"  cy="48" r="1.6" style="fill:#eeeeee" />
    <circle cx="50"  cy="68" r="1.6" style="fill:#eeeeee" />
    <circle cx="130" cy="88" r="1.6" style="fill:#eeeeee" />

    <text x="90" y="43" text-anchor="middle"
       style="font-size:6px;fill:#9b5cff">½ dt · f</text>
    <text x="130" y="63" text-anchor="middle"
       style="font-size:6px;fill:#ffaf00">dt · g</text>
    <text x="170" y="83" text-anchor="middle"
       style="font-size:6px;fill:#ff5a5a">½ dt · f</text>

    <!-- time axis -->
    <path d="M 30,110 H 224"
       style="fill:none;stroke:#eeeeee;stroke-width:0.5;marker-end:url(#arrow-time)"
       id="axis-time" />
    <text x="226" y="113"
       style="font-size:6px;fill:#eeeeee">t</text>

    <path d="M 50,107 V 113"
       style="fill:none;stroke:#eeeeee;stroke-width:0.5" />
    <path d="M 130,107 V 113"
       style="fill:none;stroke:#eeeeee;stroke-width:0.5" />
    <path d="M 210,107 V 113"
       style="fill:none;stroke:#eeeeee;stroke-width:0.5" />

    <text x="50" y="121" text-anchor="middle"
       style="font-size:6px;fill:#eeeeee">t<tspan dy="1.5" style="font-size:4px">n</tspan></text>
    <text x="130" y="121" text-anchor="middle"
       style="font-size:6px;fill:#eeeeee">t<tspan dy="1.5" style="font-size:4px">n + dt/2</tspan></text>
    <text x="210" y="121" text-anchor="middle"
       style="font-size:6px;fill:#eeeeee">t<tspan dy="1.5" style="font-size:4px">n + dt</tspan></text>
  </g>
</svg>
