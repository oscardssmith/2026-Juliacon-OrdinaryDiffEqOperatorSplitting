<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="580" viewBox="0 0 1040 580" role="img">
  <title>Operator splitting of a reaction-diffusion system</title>
  <desc>The diffusion term yields one global linear system, the reaction term decouples into one small nonlinear system per node.</desc>

  <style>
    /* solarized dark ("moon" reveal theme) — edit these to retheme */
    .eq      { font-family: Georgia, "Times New Roman", serif; font-style: italic; fill: #eee8d5; }
    .op      { font-style: normal; }
    .lbl     { font-family: Lato, "Helvetica Neue", Helvetica, Arial, sans-serif; }
    .muted   { fill: #839496; }
    .dif     { fill: #5fb0e5; }
    .rea     { fill: #e08a45; }
    .lead-d  { stroke: #268bd2; stroke-width: 2; fill: none; stroke-linecap: round; }
    .lead-r  { stroke: #cb4b16; stroke-width: 2; fill: none; stroke-linecap: round; }
    .stem    { stroke: #657b83; stroke-width: 2; fill: none; stroke-linecap: round; }
    .br-d    { stroke: #268bd2; stroke-width: 2.4; fill: none; }
    .br-r    { stroke: #cb4b16; stroke-width: 2.4; fill: none; }
    .panel   { fill: #073642; fill-opacity: .5; stroke: #586e75; stroke-width: 1.2; }
    .e-on    { stroke: #268bd2; stroke-width: 1.5; }
    .e-off   { stroke: #586e75; stroke-width: 1.2; stroke-dasharray: 3 3; }
    .n-d     { fill: #268bd2; }
    .n-r     { fill: #d9662a; }
    .box     { fill: none; stroke: #268bd2; stroke-width: 1.6; stroke-dasharray: 7 5; }
    .ring    { fill: none; stroke: #cb4b16; stroke-width: 1.1; stroke-dasharray: 2.6 2.2; }
  </style>

  <defs>
    <marker id="ah-d" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#268bd2"/>
    </marker>
    <marker id="ah-r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#cb4b16"/>
    </marker>

    <g id="edges" stroke-linecap="round">
      <path fill="none" d="M0,0 L58,-6 L112,4 L168,-2
                           M-4,46 L52,40 L108,50 L170,44
                           M2,92 L60,88 L114,96 L166,90
                           M0,0 L-4,46 L2,92
                           M58,-6 L52,40 L60,88
                           M112,4 L108,50 L114,96
                           M168,-2 L170,44 L166,90
                           M0,0 L52,40 M58,-6 L108,50 M112,4 L170,44
                           M-4,46 L60,88 M52,40 L114,96 M108,50 L166,90"/>
    </g>

    <g id="nodes">
      <circle cx="0"   cy="0"  r="3.2"/><circle cx="58"  cy="-6" r="3.2"/>
      <circle cx="112" cy="4"  r="3.2"/><circle cx="168" cy="-2" r="3.2"/>
      <circle cx="-4"  cy="46" r="3.2"/><circle cx="52"  cy="40" r="3.2"/>
      <circle cx="108" cy="50" r="3.2"/><circle cx="170" cy="44" r="3.2"/>
      <circle cx="2"   cy="92" r="3.2"/><circle cx="60"  cy="88" r="3.2"/>
      <circle cx="114" cy="96" r="3.2"/><circle cx="166" cy="90" r="3.2"/>
    </g>

    <g id="rings">
      <circle cx="0"   cy="0"  r="10.5"/><circle cx="58"  cy="-6" r="10.5"/>
      <circle cx="112" cy="4"  r="10.5"/><circle cx="168" cy="-2" r="10.5"/>
      <circle cx="-4"  cy="46" r="10.5"/><circle cx="52"  cy="40" r="10.5"/>
      <circle cx="108" cy="50" r="10.5"/><circle cx="170" cy="44" r="10.5"/>
      <circle cx="2"   cy="92" r="10.5"/><circle cx="60"  cy="88" r="10.5"/>
      <circle cx="114" cy="96" r="10.5"/><circle cx="166" cy="90" r="10.5"/>
    </g>
  </defs>

  <!-- ============ the equation ============ -->
  <g class="eq" font-size="44" text-anchor="middle">
    <text x="320" y="70">∂<tspan font-size="27" dy="9">t</tspan><tspan dy="-9" dx="4">r</tspan></text>
    <text x="395" y="70">=</text>
    <text x="520" y="70" class="dif"><tspan class="op">∇·</tspan>(D<tspan class="op"> ∇</tspan>r)</text>
    <text x="640" y="70">+</text>
    <text x="720" y="70" class="rea">R(r)</text>
  </g>

  <!-- pointers -->
  <path class="lead-d" d="M436,86 H604 M520,86 V100"/>
  <path class="lead-r" d="M675,86 H765 M720,86 V100"/>

  <g class="lbl" text-anchor="middle">
    <text x="520" y="122" font-size="24" font-weight="700" class="dif">diffusion</text>
    <text x="520" y="146" font-size="17" class="muted">linear · non-local</text>
    <text x="720" y="122" font-size="24" font-weight="700" class="rea">reaction</text>
    <text x="720" y="146" font-size="17" class="muted">nonlinear · local</text>
  </g>

  <!-- ============ the split ============ -->
  <path class="stem" d="M520,166 V180"/>
  <path class="br-d" marker-end="url(#ah-d)" d="M520,180 C460,180 340,188 272,212"/>
  <path class="br-r" marker-end="url(#ah-r)" d="M520,180 C580,180 700,188 768,212"/>
  <text class="lbl muted" x="520" y="206" font-size="17" font-style="italic" text-anchor="middle">operator splitting</text>

  <!-- ============ diffusion sub-problem ============ -->
  <rect class="panel" x="40" y="228" width="460" height="332" rx="10"/>
  <text class="eq dif" x="270" y="272" font-size="26" text-anchor="middle">∂<tspan font-size="16" dy="6">t</tspan><tspan dy="-6" dx="3">r = </tspan><tspan class="op">∇·</tspan>(D<tspan class="op"> ∇</tspan>r)</text>

  <rect class="box" x="102" y="288" width="336" height="214" rx="14"/>
  <g transform="translate(128.9,318.5) scale(1.7)">
    <use href="#edges" class="e-on"/>
    <use href="#nodes" class="n-d"/>
  </g>

  <g class="lbl" text-anchor="middle">
    <text x="270" y="524" font-size="19" font-weight="700" class="dif">one global linear system</text>
    <text x="270" y="548" font-size="17" class="muted">couples every node · sparse, symmetric</text>
  </g>

  <!-- ============ reaction sub-problem ============ -->
  <rect class="panel" x="540" y="228" width="460" height="332" rx="10"/>
  <text class="eq rea" x="770" y="272" font-size="26" text-anchor="middle">∂<tspan font-size="16" dy="6">t</tspan><tspan dy="-6" dx="3">r = R(r)</tspan></text>

  <g transform="translate(628.9,318.5) scale(1.7)">
    <use href="#edges" class="e-off"/>
    <use href="#rings" class="ring"/>
    <use href="#nodes" class="n-r"/>
  </g>

  <g class="lbl" text-anchor="middle">
    <text x="770" y="524" font-size="19" font-weight="700" class="rea">one small nonlinear system per node</text>
    <text x="770" y="548" font-size="17" class="muted">independent · no linear algebra</text>
  </g>
</svg>
